# Builds the site and copies the files to a private S3 bucket on every push to main.
# This only stores the files. It does not put the site live.
name: Upload site to S3

on:
  push:
    branches: [main]
  workflow_dispatch:
  # WordPress calls this when the client publishes or updates a post (see docs/CMS-SETUP.md).
  repository_dispatch:
    types: [wordpress-publish]

permissions:
  contents: read

concurrency:
  group: upload-s3
  cancel-in-progress: true

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - name: Build (pulls the latest posts from WordPress first)
        run: npm run build
        env:
          WP_API: ${{ vars.WP_API }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Copy dist to S3
        run: aws s3 sync dist s3://bhalla-spine-site --delete

      # A zip of the finished site, for any host that is not S3 (download it, or add an SFTP/rsync step).
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          retention-days: 14
